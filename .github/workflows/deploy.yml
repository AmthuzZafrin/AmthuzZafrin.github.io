# Build the site and publish it to GitHub Pages on every push to main.
#
# The repository is a user site (amthuzzafrin.github.io), so Pages serves it
# from the domain root. That matters: every asset on this site is referenced
# from the root — /hero-ai.webp, /fonts/madane.ttf — and a project site served
# from /repo-name/ would 404 on all of them unless Vite were given a base path.
# Publishing at the root means the built output needs no rewriting at all.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes one still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
