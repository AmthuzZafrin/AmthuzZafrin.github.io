    <title>Amthuz Zafrin</title>
    <!-- Three faces, three jobs.

         Instrument Serif carries the chapter titles — The Premise, The Work,
         The Receipts — which are written as editorial headings and were being
         set in the same grotesque as the buttons around them. A high-contrast
         serif at display size is the single change that stops the page reading
         as a template.

         Inter is the interface, and the running copy with it. It replaced
         Plus Jakarta Sans, which was chosen here for being warmer and more
         drawn — the right call for a page that wanted personality in its
         paragraphs, the wrong one for a page whose personality now lives in
         two display faces above them. Under Madane and Tradehouse the body
         text has one job left, which is to be read without being noticed.

         It is also the only one of the three that is served variable. This
         stylesheet asks for 450, 550 and 650 in a dozen places; Jakarta
         shipped 400/500/600/700/800 and those in-between weights were being
         rounded off or faked. Inter draws them.

         Amiri is for the Arabic — a classical Naskh, because the prophets'
         names carry full vowel marks and no system font renders those
         reliably across platforms. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Instrument+Serif:ital@0;1&family=Inter:opsz,wght@14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  </body>
